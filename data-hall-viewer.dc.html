<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/longmotive-design-system-8d1e5cc8-409c-43e1-9315-92313b8f450f/styles.css">
<script src="_ds/longmotive-design-system-8d1e5cc8-409c-43e1-9315-92313b8f450f/_ds_bundle.js"></script>
<script src="viewer-hud.js"></script>

<style>
  html,body{margin:0;padding:0;background:var(--surface-page)}
  *{box-sizing:border-box}
  a{color:var(--text-link);text-decoration:none}
  a:hover{color:var(--text-link-hover)}
  @keyframes lmPageFade{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);animation:lmPageFade 1.4s ease both">
  <header style="position:relative;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-subtle)">
    <div style="max-width:var(--container-max);margin:0 auto;padding:0 var(--gutter);height:60px;display:flex;align-items:center;justify-content:space-between;gap:24px">
      <a href="index.html" style="display:inline-flex;align-items:center;gap:6.5px;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.02em;color:var(--color-brand)"><img src="assets/lm-mark.png" alt="" style="height:42px;width:auto;display:block"><span style="display:inline-block;line-height:.78;font-size:25.5px"><span style="display:block">LONG</span><span style="display:block;color:var(--color-accent)">MOTIVE</span></span></a>
      <div style="display:flex;align-items:center;gap:18px">
        <a href="index.html" style="font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)">&#8592; Home</a>
        <a href="index.html#Projects" style="font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)">Projects</a>
      </div>
    </div>
    <lm-viewer-switch data-current="data-hall"></lm-viewer-switch>
  </header>

  <section style="flex:1;padding:0 var(--gutter)">
    <div style="max-width:var(--container-max);margin:20px auto 0;position:relative;z-index:2">
      <div style="border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg);background:#f4f7fa;height:calc(100vh - 196px);min-height:440px">
        <lm-datahall-viewer auto-rotate="{{ autoRotateAttr }}" style="width:100%;height:100%"></lm-datahall-viewer>
      </div>
    </div>
  </section>

  <section style="padding:34px var(--gutter) 10px">
    <div style="max-width:var(--container-max);margin:0 auto">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:16px">
        <span style="display:inline-flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent)"><span style="width:28px;height:2px;background:currentColor"></span>On Site</span>
        <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)">A hyperscale campus in Johor</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
        <sc-for list="{{ photos }}" as="p" hint-placeholder-count="4">
          <figure style="margin:0;display:flex;flex-direction:column;gap:9px">
            <div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle);box-shadow:var(--shadow-sm);aspect-ratio:16/10;background:var(--surface-muted)"><img data-src="{{ p.src }}" alt="{{ p.cap }}" style="width:100%;height:100%;object-fit:cover"/></div>
            <figcaption style="display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)"><span style="width:16px;height:2px;background:var(--color-accent);flex:none"></span>{{ p.cap }}</figcaption>
          </figure>
        </sc-for>
      </div>
    </div>
  </section>

  
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;autoRotate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Viewer&quot;}}">
const PHOTOS=[
  {src:'uploads/datahall/hf_20260728_073011_393bd3f8-fcf4-4bbe-a53e-7e8936b8a5ce.png',cap:'Contained cold aisle'},
  {src:'uploads/datahall/hf_20260728_073011_8449058d-c652-45e9-a707-e8dd7254399e.png',cap:'Cable drops to rack tops'},
  {src:'uploads/datahall/hf_20260728_073011_e04d94a7-61ed-4385-b046-888b8ac9227d.png',cap:'Rack-top cable management'},
  {src:'uploads/datahall/hf_20260728_073011_10e46718-1ffb-4493-8d16-bcd014e57d64.png',cap:'Epoxy slab, rack rows beyond'}
];
class Component extends DCLogic {
  // copy data-src → src only once real values exist (avoids requesting "{{ p.src }}")
  _applySrcs=()=>{
    if(typeof document==='undefined')return;
    document.querySelectorAll('img[data-src]').forEach(el=>{
      const s=el.getAttribute('data-src');
      if(!s||s.indexOf('{{')!==-1)return;
      if(el.getAttribute('src')!==s)el.src=s;
    });
  };
  componentDidMount(){ this._applySrcs(); }
  renderVals(){
    if(typeof window!=='undefined')requestAnimationFrame(this._applySrcs);
    return {
      autoRotateAttr:(this.props.autoRotate??true)?'on':'off',
      photos:PHOTOS
    };
  }
}
</script>
</body>
</html>
