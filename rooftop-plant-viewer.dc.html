<style>
  html,body{margin:0;padding:0;background:var(--surface-page)}

  a:hover{color:var(--text-link-hover)}
  @keyframes lmPageFade{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

<div style="min-height:100vh;display:flex;flex-direction:column;background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);animation:lmPageFade 1.2s ease both">
  <header style="position:relative;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-subtle)">
    <div style="max-width:var(--container-max);margin:0 auto;padding:0 var(--gutter);height:60px;display:flex;align-items:center;justify-content:space-between;gap:24px">
      <a href="index.html" style="display:inline-flex;align-items:center;gap:6.5px;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.02em;color:var(--color-brand)"><img src="assets/lm-mark.png" alt="" style="height:22px;width:auto;display:block"><span>LONG<span style="color:var(--color-accent)">MOTIVE</span></span></a>

        <a href="index.html#Projects" style="font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)">Projects</a>
      </div>
    </div>
    <lm-viewer-switch data-current="rooftop-plant"></lm-viewer-switch>
  </header>

  <section style="flex:1;padding:0 var(--gutter)">
    <div style="max-width:var(--container-max);margin:20px auto 0;position:relative;z-index:2">
      <div style="border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg);background:#f4f6f8;height:min(80vh,860px);min-height:460px">
        <lm-rooftop-viewer style="width:100%;height:100%"></lm-rooftop-viewer>
      </div>
      <p style="margin:10px 2px 0;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)">Coordination model &#183; metres, Y-up &#183; 4 stored views &#183; 1 aerial / 2 tower row / 3 plan / 4 level change &#183; B building &#183; S screen wall &#183; F fans &#183; C colour by system &#183; A show all &#183; R reset</p>
    </div>
  </section>

  <sc-if value="{{ showScopeNotes }}" hint-placeholder-val="{{ true }}">
  
  </sc-if>

<script type="text/x-dc" data-dc-script data-props="{&quot;showScopeNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Page&quot;},&quot;colourBySystem&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Viewer&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { showScopeNotes: this.props.showScopeNotes ?? true };
  }
  componentDidMount() {
    const v = document.querySelector('lm-rooftop-viewer');
    if (v && this.props.colourBySystem) v.setAttribute('color-by', 'true');
  }
}
</script>
