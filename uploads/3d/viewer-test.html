<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ECC Monitoring Room — Three.js viewer test</title>
<style>html,body{margin:0;height:100%;background:#1a1c1e}#app{width:100%;height:100%}
#hud{position:fixed;top:10px;left:12px;color:#cfd2d6;font:13px/1.4 system-ui;background:#0008;padding:6px 10px;border-radius:6px}</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app"></div><div id="hud">loading…</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const el=document.getElementById('app'), hud=document.getElementById('hud');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
el.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a1c1e);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.05,100);
camera.position.set(7.2,2.0,-5.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

const dir=new THREE.DirectionalLight(0xffffff,1.2);
dir.position.set(4,6,-3);
scene.add(dir, new THREE.AmbientLight(0xffffff,0.25));

new GLTFLoader().load('ecc-monitoring-room.glb',(g)=>{
  scene.add(g.scene);
  const box=new THREE.Box3().setFromObject(g.scene);
  const c=box.getCenter(new THREE.Vector3());
  controls.target.copy(c);
  let meshes=0; g.scene.traverse(o=>{if(o.isMesh)meshes++});
  hud.textContent=`ecc-monitoring-room.glb loaded — ${meshes} meshes, bounds ${box.max.x-box.min.x|0}×${box.max.y-box.min.y|0}×${(box.max.z-box.min.z).toFixed(0)} m`;
},(p)=>{hud.textContent=`loading ${p.total?Math.round(p.loaded/p.total*100)+'%':Math.round(p.loaded/1e6)+' MB'}`},
(e)=>{hud.textContent='ERROR: '+e});

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
</body>
</html>
